when:
  event:
    - push
    - pull_request

steps:
  validate:
    image: golang:1.22
    commands:
      - |
        unformatted="$(find . -type f -name '*.go' -print0 | xargs -0 gofmt -l)"
        if [ -n "$unformatted" ]; then
          printf 'Run gofmt on these files:\n%s\n' "$unformatted"
          exit 1
        fi
      - go test ./...
      - go vet ./...
      - go build ./...
      - GOOS=js GOARCH=wasm go build -trimpath -o /tmp/pybot.wasm ./cmd/pybotwasm
